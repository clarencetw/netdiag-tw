name: Tests (offline)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate CLI (no network)
        run: python scripts/netdiag.py plan
      - name: Compile Python (no network)
        run: python -m compileall -q scripts tests
      - name: Render synthetic report (no network)
        run: python scripts/netdiag.py report examples/SYNTHETIC-RESULT.json --output results/synthetic.md
